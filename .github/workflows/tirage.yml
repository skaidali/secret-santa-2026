name: Secret Santa Auto-Draw

on:
  schedule:
    # Vérifie toutes les 30 minutes si le nombre de participants est atteint
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permet aussi de lancer le tirage manuellement à tout moment

permissions:
  contents: write

jobs:
  draw:
    # Ne lance pas le robot inutilement si le tirage est déjà publié
    if: hashFiles('tirage.json') == ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check registrations and run draw
        id: draw
        env:
          NB_PARTICIPANTS: "6" # ⚠️ Indique ici le nombre exact de participants attendus
        run: node scripts/draw.js

      - name: Commit and push tirage.json
        if: steps.draw.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tirage.json
          git commit -m "chore: publish encrypted draw"
          git push