name: Secret Santa Auto-Draw

on:
    schedule:
    - cron: '0 * * * *'
    workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run draw
        id: draw
        run: node scripts/draw.js

      - name: Commit and push tirage.json
        if: steps.draw.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tirage.json
          git commit -m "chore: publish encrypted draw"
          git push