name: Secret Santa Auto-Draw

on:
    schedule:
    - cron: '0 * * * *'
    workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tirage_existe: ${{ steps.check_file.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tirage.json
      - id: check_file
        run: |
          if [ -f "tirage.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  draw:
    needs: check
    if: needs.check.outputs.tirage_existe == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: draw
        env:
          NB_PARTICIPANTS: "6"
        run: node scripts/draw.js
      - if: steps.draw.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tirage.json
          git commit -m "chore: publish encrypted draw"
          git push